# otterdeploy — PRODUCTION stack (published images)
# =================================================
# This is the image-based compose the installer fetches to a host and runs with
#   docker compose -f docker-compose.yml --env-file .env up -d
# It is the published counterpart of the dev docker-compose.yml (which builds
# from source). Differences that matter:
#   - every service is a PINNED published image (${OTTERDEPLOY_VERSION}); no build.
#   - includes the `server` control plane (dashboard/API on ${CONTROL_PLANE_PORT}).
#   - all services join the shared EXTERNAL `otterdeploy` network the installer
#     created (see `networks:` at the bottom).
#   - the `firewall` profile (CrowdSec) is started by DEFAULT by install.sh
#     (od-5j8.11) — set OTTERDEPLOY_FIREWALL=false / --no-firewall to opt out.
#   - 5432 is intentionally NOT published — the control plane reaches its own
#     Postgres over the container network; databases are never exposed on the host.
#
# All values come from the installer-generated .env (OTTERDEPLOY_VERSION,
# POSTGRES_*, DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, OTTERDEPLOY_DATA_DIR,
# CONTROL_PLANE_PORT, BRANCH_ZFS_POOL, …). Image registry overridable via
# OTTERDEPLOY_REGISTRY (default ghcr.io/otterdeploy).

name: otterdeploy

services:
  # ── control-plane datastore ───────────────────────────────────────────────
  postgres:
    # Pinned to 17 — postgres:18+ refuses our /var/lib/postgresql/data mount
    # (matches the pin in packages/api/src/constants.ts and the db engines).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otterdeploy}
      # Always written by the installer; the postgres image itself rejects an
      # empty password, so no `:?` guard (which would break pre-.env validation).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-otterdeploy}
    volumes:
      - otterdeploy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otterdeploy} -d ${POSTGRES_DB:-otterdeploy}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - otterdeploy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── control plane (dashboard + API + runtime driver) ──────────────────────
  server:
    image: ${OTTERDEPLOY_REGISTRY:-ghcr.io/otterdeploy}/server:${OTTERDEPLOY_VERSION:-latest}
    # The unified image's WORKDIR is apps/builder (so the build helper's relative
    # `bun run src/build-one.ts` resolves); the server serves the SPA from
    # `./public` relative to its cwd, so run it from apps/server.
    working_dir: /app/apps/server
    command: ["bun", "run", "dist/index.mjs"]
    restart: unless-stopped
    # od-5j8.10: the dashboard/API listens on 3000, published to the HOST
    # LOOPBACK ONLY — never 0.0.0.0. A fresh install must not expose a
    # plaintext dashboard to the internet; bootstrap access is over an SSH
    # tunnel (`ssh -L 3000:localhost:3000 ...`) or, once a control-plane
    # domain is configured, verified HTTPS through Caddy (80/443), which
    # fronts USER-deployed apps AND — when a control-plane domain is set —
    # this dashboard, reaching it by service DNS (server:3000) over the
    # internal compose network rather than this published port.
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Reach the compose datastores by service DNS (override any host-localhost
      # value that may be present in .env).
      DATABASE_URL: postgres://${POSTGRES_USER:-otterdeploy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-otterdeploy}
      REDIS_URL: redis://redis:6379
      # Permissioned management channel shared only with the edge container.
      # No TCP admin listener exists on any workload-reachable network.
      CADDY_ADMIN_URL: unix:///run/caddy-admin/admin.sock
      CADDY_ADMIN_BIND: unix//run/caddy-admin/admin.sock|0600
      # Where the edge Caddy reaches the control plane for deploy-protection
      # forward_auth (and the control-plane-domain route). The default
      # (host.docker.internal:3000) assumes the server runs on the host — a dev
      # setup; in this compose the server is a container, so point Caddy at its
      # service DNS on the shared network or forward_auth times out → 502.
      DEPLOY_AUTHZ_UPSTREAM: server:3000
      # Where Caddy streams structured access/operational logs (`log { output
      # net … }` in the reconciled Caddyfile). Unset ⇒ NO log blocks are
      # emitted and the Edge Logs page stays permanently empty. Same
      # container-vs-host story as DEPLOY_AUTHZ_UPSTREAM: the sink listens
      # inside the server container (EDGE_LOG_PORT, default 9100), Caddy
      # reaches it by service DNS on the shared network.
      EDGE_LOG_SINK: server:9100
    volumes:
      # Drive the HOST Docker daemon — this is how the runtime() driver
      # provisions services/databases/compose stacks.
      - /var/run/docker.sock:/var/run/docker.sock
      - otterdeploy-caddy-admin:/run/caddy-admin
      # Host data folder at the SAME path inside + out, so paths the control
      # plane writes (caddy config, backups, build clones, escape hatches)
      # resolve identically when bind-mounted into helper/edge containers.
      - ${OTTERDEPLOY_DATA_DIR:-/data/otterdeploy}:${OTTERDEPLOY_DATA_DIR:-/data/otterdeploy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The server image ships curl + a /health route; nothing depends on this
      # being healthy (the installer gates on the port from the host), so a
      # misconfigured probe never blocks the stack.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # NOTE: ZFS-backed database branching (BRANCH_ZFS_POOL) requires the control
    # plane to run `zfs`/`zpool` on the HOST. Wiring that host-exec path
    # (privileged + /dev/zfs, or a host agent) is deferred; until then the
    # logical (pg_dump) branching tier works with no extra mounts.

  # ── standalone rootless BuildKit (od-48w) ──────────────────────────────────
  # Closes the shared PRIVILEGED buildx docker-container builder every
  # tenant's Dockerfile/Railpack `RUN` step used to execute in (`docker
  # inspect` on that builder showed `"Privileged": true` — buildx's
  # docker-container driver hardcodes that flag on the container it creates,
  # regardless of the image, so `--driver-opt image=...-rootless` did NOT
  # close it). This container is never managed by buildx — `builder` below
  # reaches it purely over the network via buildx's `remote` driver, which
  # only opens a connection and never spawns/owns a container. Verify:
  # `docker inspect otterdeploy-buildkitd --format '{{.HostConfig.
  # Privileged}}'` → false. No `--cap-add`; `security_opt` only relaxes the
  # seccomp/apparmor DEFAULT profiles that block rootless BuildKit's own
  # unprivileged user-namespace sandboxing — far short of `--privileged`.
  buildkitd:
    image: moby/buildkit:buildx-stable-1-rootless
    container_name: otterdeploy-buildkitd
    command:
      - --addr
      - tcp://0.0.0.0:1234
      # Verified locally: without this, every build's first RUN step fails
      # mounting /proc — nested rootless process isolation conflicts with the
      # sandboxing already applied to this unprivileged container. Upstream's
      # own guidance: disable it "only when BuildKit is running in a
      # container as an unprivileged user" — exactly this setup. Doesn't
      # weaken the container boundary itself, only BuildKit's own redundant
      # internal process sandbox.
      - --oci-worker-no-process-sandbox
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    restart: unless-stopped
    volumes:
      # buildkitd's OWN persistent layer cache + snapshotter state, in a named
      # volume nothing else mounts — the one piece of state every tenant's
      # build intentionally shares (BuildKit's own content-addressed cache),
      # replacing the old per-repo local-dir cache bind-mounted into every
      # throwaway helper container.
      - otterdeploy-buildkit-data:/home/user/.local/share/buildkit
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://localhost:1234", "debug", "workers"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── build worker (git-sourced services) ───────────────────────────────────
  builder:
    # SAME image as `server` (unified) — the build worker is just a different
    # command (bun runs the builder's TS source) on top of the docker CLI +
    # buildx + railpack toolchain the image already carries.
    image: ${OTTERDEPLOY_REGISTRY:-ghcr.io/otterdeploy}/server:${OTTERDEPLOY_VERSION:-latest}
    working_dir: /app/apps/builder
    command: ["bun", "run", "src/index.ts"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-otterdeploy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-otterdeploy}
      REDIS_URL: redis://redis:6379
      # Per-build helper containers: which image to spawn + which network to
      # attach them to (the shared otterdeploy network, so they resolve
      # postgres/redis by name). Same unified image; the helper's command
      # (bun run src/build-one.ts) is set by the worker (handler.ts).
      BUILDER_HELPER_IMAGE: ${OTTERDEPLOY_REGISTRY:-ghcr.io/otterdeploy}/server:${OTTERDEPLOY_VERSION:-latest}
      BUILDER_HELPER_NETWORK: ${OTTERDEPLOY_NETWORK:-otterdeploy}
      # Standalone rootless buildkitd (od-48w) — service DNS on the shared
      # otterdeploy network. Forwarded into each per-build helper (see
      # apps/builder/src/helper-args.ts); used via buildx's `remote` driver
      # (apps/builder/src/buildx.ts) — no privileged builder is ever created.
      BUILDKIT_ADDR: tcp://buildkitd:1234
      OTTERDEPLOY_DATA_DIR: ${OTTERDEPLOY_DATA_DIR:-/data/otterdeploy}
    volumes:
      # Docker-out-of-Docker: still needed for the local/no-registry `--load`
      # fallback and the post-build swarm rollout (see od-48w notes in
      # apps/builder/src/helper-args.ts) — a build that has both a registry
      # AND buildkitd available skips this entirely via `buildx build --push`.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path data folder. NOT bind-mounted into the per-build helper
      # anymore — buildkitd owns the persistent build cache in its own volume.
      - ${OTTERDEPLOY_DATA_DIR:-/data/otterdeploy}:${OTTERDEPLOY_DATA_DIR:-/data/otterdeploy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      buildkitd:
        condition: service_healthy

  # ── edge proxy ────────────────────────────────────────────────────────────
  caddy:
    # Custom image: Caddy + the CrowdSec bouncer plugin + Staticfile support
    # (xcaddy build, published from infra/caddy).
    image: ${OTTERDEPLOY_REGISTRY:-ghcr.io/otterdeploy}/caddy:${OTTERDEPLOY_VERSION:-latest}
    restart: unless-stopped
    # Seed a placeholder Caddyfile on first boot so Caddy starts before the
    # control plane has reconciled the real one; the server then pushes config
    # through a permissioned Unix socket mounted only into Caddy + server.
    # Removing the stale socket before start makes unclean restarts recover.
    environment:
      CADDY_ADMIN_BIND: unix//run/caddy-admin/admin.sock|0600
      CADDY_ADMIN_SOCKET_PATH: /run/caddy-admin/admin.sock
    command: >
      sh -c "mkdir -p /etc/caddy /run/caddy-admin &&
             rm -f /run/caddy-admin/admin.sock &&
             [ -s /etc/caddy/Caddyfile ] ||
               printf '{\n  admin unix//run/caddy-admin/admin.sock|0600\n}\n:80 {\n  respond \"otterdeploy is starting…\" 503\n}\n' > /etc/caddy/Caddyfile &&
             caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Reconciled Caddyfile lives under the data folder (written by the server).
      - ${OTTERDEPLOY_DATA_DIR:-/data/otterdeploy}/caddy:/etc/caddy
      - otterdeploy-caddy-data:/data
      - otterdeploy-caddy-state:/config
      - otterdeploy-caddy-admin:/run/caddy-admin
      # Rolled access-log mirror the CrowdSec agent tails below (`log
      # crowdsec-access` in the reconciled Caddyfile) — od-5j8.11: without
      # this mount, CrowdSec's `crowdsecurity/caddy` collection never sees a
      # request and HTTP brute-force/CVE-probe scenarios never fire.
      - otterdeploy-caddy-logs:/var/log/caddy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "test -S \"$${CADDY_ADMIN_SOCKET_PATH}\""]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── firewall (od-5j8.11: on by DEFAULT via install.sh — set
  # OTTERDEPLOY_FIREWALL=false / COMPOSE_PROFILES= to opt out) ───────────────
  # Full parity with the dev compose (docker-compose.yml) — this is the file
  # install.sh actually fetches to a host, so it's the one that must carry
  # the log acquisition + collections wiring or CrowdSec never sees SSH/HTTP
  # attack traffic in production (the gap od-5j8.11 closed: this block used
  # to be a bare CAPI-blocklist-only agent with no sshd/Caddy detection).
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: otterdeploy-crowdsec
    profiles: ["firewall"]
    restart: unless-stopped
    environment:
      # Auto-register the Caddy bouncer with our shared key on first boot.
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:-}
      # The native host firewall bouncer's own key — install.sh sets it up as
      # a systemd service on the primary (provision-host-firewall.ts extends
      # the same install to every node added afterward). Separate key so
      # either bouncer can be revoked without breaking the other. Empty ⇒
      # registration skipped.
      BOUNCER_KEY_firewall: ${CROWDSEC_FIREWALL_BOUNCER_KEY:-}
      # Parsers + scenarios for the two log sources below (installed on boot)
      # — od-5j8.11: without this, the agent only ever consumes the CAPI
      # community blocklist; SSH brute force and HTTP/CVE probes never
      # generate decisions.
      COLLECTIONS: "crowdsecurity/sshd crowdsecurity/caddy"
      # SQLite WAL — without it, concurrent access (cscli + LAPI + blocklist
      # imports) starves the LAPI into "database is locked" 401s.
      USE_WAL: "true"
    volumes:
      - otterdeploy-crowdsec-config:/etc/crowdsec
      - otterdeploy-crowdsec-data:/var/lib/crowdsec/data
      # Host logs, read-only — the whole directory rather than auth.log
      # alone, so logrotate's rename doesn't strand a single-file bind mount
      # on a stale inode.
      - /var/log:/var/log/host:ro
      # Caddy's rolled access-log file (`log crowdsec-access` capture).
      - otterdeploy-caddy-logs:/var/log/caddy:ro
    configs:
      - source: crowdsec-acquis
        target: /etc/crowdsec/acquis.d/otterdeploy.yaml
    ports:
      # LAPI on the host LOOPBACK by default — how the native firewall
      # bouncer (a host process, outside the compose network) reaches the
      # engine. Multi-server installs: set CROWDSEC_LAPI_BIND to the
      # manager's routable/mesh IP so firewall bouncers installed on added
      # nodes can connect (each authenticates with its own API key).
      # In-network callers are unaffected: Caddy still uses
      # http://crowdsec:8080 via service DNS.
      - "${CROWDSEC_LAPI_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

# All services attach to the shared network the installer created
# (`docker network create otterdeploy`). Per-project resource networks are
# created dynamically by the control plane on top of this.
networks:
  default:
    name: ${OTTERDEPLOY_NETWORK:-otterdeploy}
    external: true

volumes:
  otterdeploy-postgres-data:
  otterdeploy-redis-data:
  otterdeploy-buildkit-data:
  otterdeploy-caddy-data:
  otterdeploy-caddy-state:
  otterdeploy-caddy-admin:
  otterdeploy-caddy-logs:
  otterdeploy-crowdsec-config:
  otterdeploy-crowdsec-data:

configs:
  # CrowdSec log acquisition — which logs the agent parses for its
  # scenarios. Inline so the compose file stays the single artifact an
  # install carries (mirrors docker-compose.yml).
  crowdsec-acquis:
    content: |
      # Host SSH auth log (sshd parser → ssh-bf / ssh-slow-bf scenarios).
      source: file
      filenames:
        - /var/log/host/auth.log
      labels:
        type: syslog
      ---
      # Caddy access logs (caddy parser → http scenarios). Written by the
      # generated Caddyfile's `log crowdsec-access` capture.
      source: file
      filenames:
        - /var/log/caddy/access*.json
      labels:
        type: caddy
