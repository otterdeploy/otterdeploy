name: Build Images

on:
  push:
    branches: [main]
    # Release tags publish PINNED images (`server:v0.4.2`) + a GitHub Release:
    # the pair the in-app updater consumes (releases/latest → compose pull of
    # the matching tag). Path filters are not evaluated for tag pushes, so a
    # release always builds even when the tagged commit touched nothing listed.
    tags: ["v*.*.*"]
    paths:
      - apps/server/**
      - apps/web/**
      - apps/builder/**
      - infra/caddy/**
      - packages/**
      - bun.lock
      - .github/workflows/images.yml
  workflow_dispatch:

# Serialize builds per ref. Two pushes to main in quick succession would
# otherwise race on the SHARED `:latest` / `:latest-<arch>` tags: whichever run
# finishes its manifest-merge last wins, so an OLDER build finishing last
# silently clobbers `:latest` with stale images.
#
# cancel-in-progress is FALSE, not true: cancelling an in-flight build mid
# `cache-to: type=gha,mode=max` export leaves a partial/corrupt buildkit cache
# that the next run imports and mis-matches, which once shipped a STALE web SPA
# (the `RUN turbo build` layer was reused across a source change). With `false`,
# a running build is never interrupted, so its cache export always completes
# cleanly; queued builds run sequentially in trigger order, so the newest commit
# still publishes `:latest` last. GitHub keeps only the newest PENDING run per
# group (older pending ones are auto-cancelled), so this doesn't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # The image tag this run publishes: the moving `latest` for main pushes, the
  # immutable semver tag itself for release tags. `latest` is intentionally NOT
  # updated by release builds. It tracks main; releases live on their own tags.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  # Per-image change detection. The workflow-level `paths` filter only gates
  # whether the workflow RUNS. Without this, any matching push rebuilt BOTH
  # images, so every server/web change also recompiled caddy and churned the
  # `caddy:latest` digest (making later `compose pull`s recreate the edge proxy
  # for nothing). Tags and manual dispatches always build everything (paths
  # filters don't apply to tag pushes; a dispatch has no diff), as does any
  # push without a usable before-SHA (force-push / new branch).
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all='["server","caddy"]'
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "images=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "images=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          images=""
          # server: full-repo context (COPY . . + bun install, builds the web
          # SPA into itself): same scope as the workflow `paths` filter.
          if grep -qE '^(apps/(server|web|builder)/|packages/|bun\.lock$|\.github/workflows/images\.yml$)' <<<"$changed"; then
            images='"server"'
          fi
          # caddy: pulls nothing from the repo outside its own build context.
          if grep -qE '^(infra/caddy/|\.github/workflows/images\.yml$)' <<<"$changed"; then
            images="${images:+$images,}\"caddy\""
          fi
          # Nothing matched (shouldn't happen given the workflow paths filter)
          # → build everything rather than silently skip.
          [ -n "$images" ] || { echo "images=$all" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "images=[$images]" >> "$GITHUB_OUTPUT"

  # Native per-arch build (no QEMU emulation) → one tagged image per arch,
  # merged into a single multi-arch manifest below. The builder image bundles
  # the railpack CLI on PATH; caddy is an xcaddy build with l4 + crowdsec.
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # `server` is now ONE image for both the control-plane server AND the
        # builder worker (roles picked by command in docker-compose.prod.yml).
        # Apps/builder/Dockerfile was retired. caddy is separate. Only images
        # whose inputs changed are built (see `changes` above); context and
        # dockerfile are picked per-image in the build step, NOT via matrix
        # `include`: an image-keyed include with no matching combination would
        # spawn a stray arch-less job when that image is filtered out.
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'caddy' && 'infra/caddy' || '.' }}
          file: ${{ matrix.image == 'caddy' && 'infra/caddy/Dockerfile' || 'apps/server/Dockerfile' }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.TAG }}-${{ matrix.arch }}
          # GitHub Actions layer cache (scoped per image+arch).
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  # Only re-merges the images built this run. A skipped image's `:latest`
  # manifest (and its per-arch tags) stays at the previous, still-valid digest.
  merge-manifest:
    name: Merge manifest (${{ matrix.image }})
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  # On release tags only: publish the GitHub Release AFTER both image manifests
  # exist, so the moment the updater sees a new `releases/latest` the pinned
  # `:vX.Y.Z` tags it will `compose pull` are already in the registry. A tag
  # containing a prerelease suffix (v0.5.0-rc.1) is marked prerelease, which
  # keeps it out of `releases/latest`. The stable channel never sees it.
  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: merge-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping (re-run of a published tag)."
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease

  # Publish the install artifacts to get.otterdeploy.com (R2, fronted by the
  # apps/get Worker) and attach them to the GitHub Release.
  #
  # Runs AFTER `release` so `versions.json` can carry the real release notes,
  # and so nothing announces a version whose images aren't in the registry yet.
  #
  # What a host actually consumes:
  #   get.otterdeploy.com/install.sh          ← scripts/install.sh
  #   get.otterdeploy.com/docker-compose.yml  ← docker-compose.PROD.yml
  #   get.otterdeploy.com/versions.json       ← built below
  #
  # Every object is written under BOTH `<tag>/` and `latest/`. The pinned copy
  # is what makes an old install reproducible: install.sh resolves a version,
  # and the compose file that shipped with it stays fetchable forever.
  publish-artifacts:
    name: Publish install artifacts
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      BUCKET: otterdeploy-get
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # A tag with a suffix (v0.5.0-rc.1) is a prerelease: it gets its pinned
      # `<tag>/` copy so testers can install it explicitly, but it must NOT move
      # `latest/` or `versions.json`. Mirrors the --prerelease logic above:
      # the stable channel never sees it.
      - name: Classify release
        id: channel
        run: |
          case "$TAG" in
            *-*) echo "stable=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "stable=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      # The rename is the whole point of staging: the repo's docker-compose.yml
      # builds from source and references a local dev image, so publishing it
      # under that name would hand every new host a compose file that can't pull.
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp scripts/install.sh        dist/install.sh
          cp scripts/uninstall.sh      dist/uninstall.sh
          cp docker-compose.prod.yml   dist/docker-compose.yml

          # Fail loudly rather than shipping a compose file that builds from
          # source: the failure mode is silent and only shows up on a user's
          # first install.
          if grep -qE '^\s*build:' dist/docker-compose.yml; then
            echo "::error::docker-compose.prod.yml contains a build: stanza. Published hosts have no source tree."
            exit 1
          fi
          if ! grep -q 'ghcr.io/' dist/docker-compose.yml; then
            echo "::error::docker-compose.prod.yml references no published images."
            exit 1
          fi

          bash -n dist/install.sh
          bash -n dist/uninstall.sh

          for f in install.sh uninstall.sh docker-compose.yml; do
            ( cd dist && sha256sum "$f" > "$f.sha256" )
          done

      # Shaped like GitHub's `releases/latest` payload (tag_name/html_url/body)
      # so the control-plane updater reads it unchanged. An operator only sets
      # OTTERDEPLOY_UPDATE_MANIFEST_URL. See
      # packages/api/src/routers/system/release-source.ts.
      - name: Build versions.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body,url,publishedAt > release.json
          jq --arg tag "$TAG" \
             --arg registry "${{ env.REGISTRY }}/${{ github.repository_owner }}" \
             '{
                tag_name:     $tag,
                html_url:     .url,
                body:         .body,
                published_at: .publishedAt,
                install_url:  ("https://get.otterdeploy.com/" + $tag + "/install.sh"),
                compose_url:  ("https://get.otterdeploy.com/" + $tag + "/docker-compose.yml"),
                images: {
                  server: ($registry + "/server:" + $tag),
                  caddy:  ($registry + "/caddy:"  + $tag)
                }
              }' release.json > dist/versions.json
          cat dist/versions.json

      - name: Upload pinned copy to R2
        run: |
          for f in install.sh install.sh.sha256 \
                   uninstall.sh uninstall.sh.sha256 \
                   docker-compose.yml docker-compose.yml.sha256; do
            case "$f" in
              *.sha256)  ct="text/plain" ;;
              *.sh)      ct="text/x-shellscript" ;;
              *)         ct="text/yaml" ;;
            esac
            npx --yes wrangler@4 r2 object put "$BUCKET/$TAG/$f" \
              --file="dist/$f" --content-type="$ct" --remote
          done

      # Only now does the release become the default for new installs.
      - name: Promote to latest
        if: steps.channel.outputs.stable == 'true'
        run: |
          for f in install.sh install.sh.sha256 \
                   uninstall.sh uninstall.sh.sha256 \
                   docker-compose.yml docker-compose.yml.sha256; do
            case "$f" in
              *.sha256)  ct="text/plain" ;;
              *.sh)      ct="text/x-shellscript" ;;
              *)         ct="text/yaml" ;;
            esac
            npx --yes wrangler@4 r2 object put "$BUCKET/latest/$f" \
              --file="dist/$f" --content-type="$ct" --remote
          done
          # Written LAST: until this lands, no running instance is told the new
          # version exists, so a half-finished promote can't advertise artifacts
          # that aren't uploaded yet.
          npx --yes wrangler@4 r2 object put "$BUCKET/versions.json" \
            --file=dist/versions.json --content-type="application/json" --remote

      # Secondary distribution + a second adoption signal: unlike GHCR, the
      # GitHub API does report per-asset download counts.
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            dist/install.sh dist/install.sh.sha256 \
            dist/uninstall.sh dist/uninstall.sh.sha256 \
            dist/docker-compose.yml dist/docker-compose.yml.sha256 \
            dist/versions.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify the edge serves the new release
        if: steps.channel.outputs.stable == 'true'
        run: |
          sleep 10
          served="$(curl -fsSL https://get.otterdeploy.com/versions.json | jq -r .tag_name)"
          if [ "$served" != "$TAG" ]; then
            echo "::warning::get.otterdeploy.com/versions.json still reports '$served' (expected '$TAG'). Edge cache is 60s, re-check shortly."
          fi
          curl -fsSL "https://get.otterdeploy.com/$TAG/docker-compose.yml" -o served-compose.yml
          diff -q served-compose.yml dist/docker-compose.yml
