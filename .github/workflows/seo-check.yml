# Hard-fails the rendered sitemap corpus, then runs the private seo-ops rules on
# same-repo pull requests, merge-queue candidates, and main. Repository branch
# protection must separately require this check if it should block a merge.
name: seo-check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/www/**"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "seo.config.json"
      - ".github/workflows/seo-check.yml"
  merge_group:

concurrency:
  group: seo-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  seo-check:
    # Ordinary secrets are unavailable to forks and Dependabot, so neither can
    # check out the private rule engine. The merge queue and same-repo PRs can.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Otterdeploy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch the shared rule engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dr34mw0rk5/seo-ops
          token: ${{ secrets.SEO_OPS_READ_TOKEN }}
          path: .seo-ops
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # TanStack Start emits a Worker rather than prerendered HTML. Running the
      # built Worker locally exercises the same bot-visible responses without
      # requiring Cloudflare credentials or a preview deployment.
      - name: Build the marketing site
        run: >-
          env -u OTTERDEPLOY_OPENAPI_SPEC_URL -u OTTERSTACK_OPENAPI_SPEC_URL
          bun run build --filter=www --cache-dir=.turbo

      - name: Serve the built Worker
        working-directory: apps/www
        env:
          CI: "true"
        run: |
          # Nitro's generated config carries the production custom-domain
          # routes. Wrangler rewrites request.url to the first route during
          # local dev, which would make localhost look like an HTTP production
          # request and exercise only the canonical redirect. Keep the entry,
          # assets, compatibility flags, and bindings, but remove routes from
          # the adjacent local-only copy so relative paths remain valid.
          jq 'del(.routes)' .output/server/wrangler.json \
            > .output/server/wrangler.seo.json
          bunx wrangler dev --config .output/server/wrangler.seo.json --port 8787 \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null --max-time 3 -w '%{http_code}' \
              http://localhost:8787/ || true)"
            if [ "$status" = "200" ]; then
              echo "worker is answering"
              exit 0
            fi
            sleep 2
          done
          echo "the worker never answered on :8787" >&2
          cat "$RUNNER_TEMP/wrangler.log" >&2
          exit 1

      - name: Check SEO invariants
        run: |
          bun apps/www/scripts/verify-seo-corpus.ts \
            --base http://localhost:8787 \
            --expect-preview-noindex
          bun run .seo-ops/bin/seo-check.ts \
            --config seo.config.json \
            --base http://localhost:8787
