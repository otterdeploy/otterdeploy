name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Turbo's local cache — keyed on the lockfile + the turbo config so a
      # dependency or pipeline change busts it.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.task }}-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ matrix.task }}-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # `bun run typecheck` = turbo typecheck --concurrency=4 --filter=!web-demo
      # (TS 7 `tsc --checkers`; the web leg runs `tsr generate` itself).
      - name: Typecheck
        if: matrix.task == 'typecheck'
        run: bun run typecheck --cache-dir=.turbo

      # oxlint (type-aware) + oxfmt --check — non-mutating CI form (the `check`
      # script formats in place with --write).
      # The type-aware pass resolves the TanStack route files, which import the
      # gitignored routeTree.gen.ts — generate the route trees first (via each
      # app's typecheck, which runs `tsr generate`; type errors are the
      # typecheck job's concern, so its exit code is ignored here).
      - name: Lint & format check
        if: matrix.task == 'lint'
        run: |
          bun run typecheck --cache-dir=.turbo || true
          bunx oxlint --type-aware --threads=4 && bunx oxfmt --check

      - name: Test
        if: matrix.task == 'test'
        run: bun run test --cache-dir=.turbo

  # Separate from the `check` matrix: this is the only job that needs a real
  # database, so it's the only one carrying the postgres:17 service
  # container. Proves the od-5j8.1 installation-bootstrap migrations + the
  # real better-auth signup hook end-to-end (od-5j8.1.1) — see
  # test-infra/integration/. Ordinary unit tests (the `test` matrix leg
  # above) never need Docker/Postgres; only this job does.
  integration:
    name: integration (postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile

      # Every test file creates + drops its own uniquely named database on
      # this instance (see test-infra/integration/postgres-harness.ts), so
      # the suite is hermetic even though the service container is shared.
      - name: Integration tests (real Postgres 17 bootstrap + upgrade)
        run: bun run test:integration
        env:
          INTEGRATION_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
