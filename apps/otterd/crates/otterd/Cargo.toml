[package]
name = "otterd"
description = "otterd: the per-node daemon of otterdeploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "otterd"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
otterd-engine.workspace = true
otterd-identity.workspace = true
otterd-journal.workspace = true
otterd-proto.workspace = true
otterd-sys.workspace = true
otterd-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
otterd-transport = { workspace = true, features = ["test-cp"] }
base64.workspace = true
tempfile.workspace = true

[lints]
workspace = true
