[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/otterdeploy/otterdeploy"

[workspace.dependencies]
otterd-engine = { path = "crates/otterd-engine" }
otterd-journal = { path = "crates/otterd-journal" }
otterd-proto = { path = "crates/otterd-proto" }
otterd-sys = { path = "crates/otterd-sys" }

base64 = "0.22"
bytes = "1"
crc32c = "0.6"
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustix = { version = "1", features = ["fs", "mount", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "fs",
  "io-util",
] }
tracing = "0.1"

# Test-only.
proptest = "1"
tempfile = "3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
todo = "deny"
