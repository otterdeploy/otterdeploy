[workspace]
resolver = "3"
members = ["crates/otterd-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/otterdeploy/otterdeploy"

[workspace.dependencies]
otterd-proto = { path = "crates/otterd-proto" }

base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
todo = "deny"
