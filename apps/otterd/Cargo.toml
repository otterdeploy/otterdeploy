[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/otterdeploy/otterdeploy"

[workspace.dependencies]
otterd-anchor = { path = "crates/otterd-anchor" }
otterd-engine = { path = "crates/otterd-engine" }
otterd-fence = { path = "crates/otterd-fence" }
otterd-identity = { path = "crates/otterd-identity" }
otterd-journal = { path = "crates/otterd-journal" }
otterd-proto = { path = "crates/otterd-proto" }
otterd-sys = { path = "crates/otterd-sys" }

base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6"
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustix = { version = "1", features = ["fs", "mount", "time", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "fs",
  "io-util",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
webpki-roots = "1"
x509-parser = "0.18"

# Test-only.
proptest = "1"
rcgen = "0.14"
tempfile = "3"
time = "0.3"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
todo = "deny"
